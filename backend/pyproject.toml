[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-backend"
version = "0.1.0"
description = "Logos AI 名词知识图谱与演化平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]",
    "neo4j",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "redis",
    "instructor==1.15.4",
    "neo4j-graphrag==1.18.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
